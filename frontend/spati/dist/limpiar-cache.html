<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>METGO SPATI · Limpiar caché</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      font-family: system-ui, sans-serif;
      background: #0b1120;
      color: #f3f4f6;
      padding: 1.5rem;
      text-align: center;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      background: #3b82f6;
      color: #04101f;
    }
    p { color: #9ca3af; max-width: 28rem; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Limpiar caché SPATI</h1>
  <p>
    Si sigue viendo la versión vieja (<code>v0.3</code> o errores en
    <code>index-D_L8c-qw.js</code>), pulse el botón. Luego vuelva al inicio.
  </p>
  <button type="button" id="go">Borrar Service Worker y caché</button>
  <p id="msg" hidden></p>
  <script>
    document.getElementById('go').onclick = async () => {
      const msg = document.getElementById('msg')
      msg.hidden = false
      msg.textContent = 'Limpiando…'
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations()
          await Promise.all(regs.map((r) => r.unregister()))
        }
        if (window.caches) {
          const keys = await caches.keys()
          await Promise.all(keys.map((k) => caches.delete(k)))
        }
        localStorage.removeItem('metgo_spati_access_token')
        msg.textContent = 'Listo. Redirigiendo…'
        setTimeout(() => {
          location.href = '/?pwa_bust=' + Date.now()
        }, 600)
      } catch (e) {
        msg.textContent = 'Error: ' + (e && e.message ? e.message : e)
      }
    }
  </script>
</body>
</html>
