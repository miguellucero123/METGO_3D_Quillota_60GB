# Despliegue SPA Vue METGO en Netlify (repo monorepo)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base = "frontend/vue"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API Flask en Render (antes del catch-all SPA; si no, /api/* devuelve index.html → 404)
[[redirects]]
  from = "/api/*"
  to = "https://metgo-api.onrender.com/api/:splat"
  status = 200
  force = true

# Vue Router (history mode)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Permitir iframe desde Streamlit Cloud
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://*.streamlit.app https://*.streamlit.io 'self'"
