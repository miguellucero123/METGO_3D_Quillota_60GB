# Despliegue SPA Vue METGO en Netlify (repo monorepo)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base = "frontend/vue"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API Flask en Render
[[redirects]]
  from = "/api/*"
  to = "https://metgo-api.onrender.com/api/:splat"
  status = 200
  force = true

# Archivos estáticos (no enviar index.html si falta un chunk → error MIME)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Vue Router (solo rutas de app; los .js en /assets/ se sirven del paso anterior o 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://*.streamlit.app https://*.streamlit.io 'self'"
