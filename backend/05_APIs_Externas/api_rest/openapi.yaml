      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: quillota }
        - name: dias
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 16 }
      responses:
        "200":
          description: Lista diaria; `desde_cache=true` si se sirvió desde caché/BD
        "401":
          description: Sin token
        "404":
          description: Estación no encontrada
        "503":
          description: OpenMeteo no disponible y sin datos persistidos
  /api/meteo/{estacion_id}/historico:
