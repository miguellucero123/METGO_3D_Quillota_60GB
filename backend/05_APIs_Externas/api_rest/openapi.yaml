      parameters:
        - name: faena_id
          in: path
          required: true
          schema: { type: string, description: "paipote | mantos_blancos | escondida | …" }
        - name: horas
          in: query
          schema: { type: integer, default: 72, minimum: 6, maximum: 168 }
        - name: incluir_observado
          in: query
          schema: { type: boolean, default: false }
