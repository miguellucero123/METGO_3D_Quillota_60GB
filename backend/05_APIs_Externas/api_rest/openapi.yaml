openapi: 3.0.3
info:
  title: METGO 3D API REST
  description: API agrometeorológica MVP — Valle de Aconcagua (Chile)
  version: 1.0.0-mvp
servers:
  - url: http://127.0.0.1:8080
    description: Desarrollo local
  - url: https://metgo-api.onrender.com
    description: Producción Render
tags:
  - name: auth
  - name: meteo
  - name: aire
  - name: operaciones
  - name: sistema
  - name: datos
  - name: servicios
paths:
  /api/health:
    get:
      tags: [sistema]
      summary: Estado del sistema (público)
      responses:
        "200":
          description: OK
  /api/health/sitios:
    get:
      tags: [sistema]
      summary: Health + frescura por sitio (E10 SLO)
      description: |
        Evalúa frescura de meteo/aire/operaciones frente a SLOs
        (`docs/roadmap/SLO_E10.md`). Query `sitio=` para un slug.
      parameters:
        - name: sitio
          in: query
          schema: { type: string }
        - name: incluir_plantilla
          in: query
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: Lista o detalle de sitio con frescura y estado
  /api/metrics:
    get:
      tags: [sistema]
      summary: Métricas Prometheus (E10)
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [prometheus, json], default: prometheus }
      responses:
        "200":
          description: text/plain Prometheus o JSON
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login JWT (E9 — claim sitio)
      description: |
        Emite JWT con `sub`, `role`, `tenant` (legacy), **`sitio`**, y **`jti`** (sesión única).
        Cada login nuevo invalida el JWT anterior del mismo usuario: llamadas con el
        token viejo reciben **401** con `code: session_replaced`.
        El body puede incluir `sitio` para scoped login; un usuario de Quillota
        no puede pedir `mantos_blancos` (403). Admin global (`sitio=null` en membresía)
        puede omitir sitio (acceso a todos) o pedirlo para limitar el token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: admin123 }
                sitio: { type: string, example: quillota, description: "Producto METGO (opcional)" }
      responses:
        "200":
          description: Token emitido (user.sitio + claim jti en payload)
        "401":
          description: "Credenciales incorrectas, o sesión reemplazada (code=session_replaced)"
        "403":
          description: Sitio no autorizado para el usuario
  /api/auth/register:
    post:
      tags: [auth]
      summary: Registro de usuario (rol lectura; requiere METGO_ALLOW_SELF_REGISTER=1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: campo_norte }
                password: { type: string, minLength: 6 }
                email: { type: string, format: email }
                sitio: { type: string, example: quillota }
      responses:
        "201":
          description: Usuario creado y token emitido
        "400":
          description: Validación fallida
  /api/auth/validate-registro:
    post:
      tags: [auth]
      summary: Dry-run validación de registro (formato + veracidad)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "{ ok: true, errors, warnings }"
        "400":
          description: "{ ok: false, errors, warnings }"
  /api/auth/register-v2:
    post:
      tags: [auth]
      summary: Registro comercial (PII cifrada + consentimientos + trial)
      description: |
        Requiere consentimientos `almacenamiento_datos`, `tos`, `privacy`, `veracidad`.
        En SPATI enviar `faena` (escondida, los_bronces, …).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nombres, apellidos, razon_social, rut, sitio, consentimientos]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                password_confirm: { type: string }
                nombres: { type: string }
                apellidos: { type: string }
                telefono: { type: string, example: "+56912345678" }
                razon_social: { type: string }
                rut: { type: string, example: "76.123.456-0" }
                sitio: { type: string, example: spati }
                faena: { type: string, example: escondida }
                consentimientos:
                  type: object
                  properties:
                    almacenamiento_datos: { type: boolean }
                    tos: { type: boolean }
                    privacy: { type: boolean }
                    veracidad: { type: boolean }
      responses:
        "201":
          description: Usuario/org creados (status pending + trial)
        "400":
          description: Validación o consentimiento faltante
  /api/auth/access:
    get:
      tags: [auth]
      summary: Acceso por pestaña (plan + faena_reglas)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sitio
          in: query
          schema: { type: string }
        - name: faena
          in: query
          schema: { type: string, example: escondida }
        - name: tab
          in: query
          schema: { type: string, enum: [panel, dron, umbrales, ambiente] }
      responses:
        "200":
          description: "{ allowed, tabs, sistemas, plan_code, sub_status }"
        "403":
          description: tab no permitida
  /api/public/planes:
    get:
      tags: [public]
      summary: Catálogo de precios escalonados
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: spati }
        - name: faena
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Planes con precio_mensual_clp
  /api/public/faenas/{faena}/reglas:
    get:
      tags: [public]
      summary: Reglas/sistemas anexables de una minera
      parameters:
        - name: faena
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{ faena, reglas, enlace }"
  /api/billing/checkout:
    post:
      tags: [billing]
      summary: Checkout Stripe o mock (aplica plan si no hay STRIPE_SECRET_KEY)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code: { type: string, enum: [trial, starter, pro, enterprise] }
                sitio: { type: string }
                faena: { type: string }
      responses:
        "200":
          description: mock aplicado o sesión
        "501":
          description: Stripe pendiente de Price IDs
  /api/billing/webhook:
    post:
      tags: [billing]
      summary: Webhook Stripe / mock aplica plan por org_id
      responses:
        "200":
          description: received
  /api/auth/verify-email:
    get:
      tags: [auth]
      summary: Verificar email con token
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Email verificado
        "400":
          description: Token inválido
  /api/auth/cuenta:
    get:
      tags: [auth]
      summary: Resumen de cuenta, suscripción y planes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: faena
          in: query
          schema: { type: string }
      responses:
        "200":
          description: cuenta + access + planes
  /api/auth/mis-faenas:
    get:
      tags: [auth]
      summary: Faenas visibles según membresía / plan multi_faena / admin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "{ catalogo_completo, multi_faena, faenas: [{slug}] }"
        "401":
          description: Sin token
  /api/auth/ops-board:
    get:
      tags: [auth]
      summary: M10 board operativo multi-faena (nivel ops + observado)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: refresh
          in: query
          schema: { type: string, enum: ["0", "1"] }
          description: Si 1, regenera paquete live (máx. N faenas)
      responses:
        "200":
          description: "{ fase, filas[], hub, generado_en }"
        "401":
          description: Sin token
        "403":
          description: Requiere admin / multi_faena / ≥2 faenas
  /api/auth/preview-hora:
    post:
      tags: [auth]
      summary: Crear usuario temporal 1 h (solo Ahora + Panel)
      description: |
        Plan preview. Auth CRON_SECRET, Bearer admin o METGO_ALLOW_PREVIEW=1.
        Tras TTL el login falla; purge-preview elimina la org.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faena: { type: string, example: quebrada_blanca }
                horas: { type: number, example: 1 }
                label: { type: string, example: demo_cliente }
      responses:
        "201":
          description: "{ email, password, faena, expires_at, login_url, tabs }"
        "401":
          description: No autorizado
  /api/auth/preview-demo:
    post:
      tags: [auth]
      summary: Upsert usuario demo fijo (demo@ventora.demo)
      description: |
        Credenciales fijas DemoVentora1! (o METGO_DEMO_PASSWORD).
        Solo Ahora + Panel. No se elimina en purge-preview.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faena: { type: string, example: quebrada_blanca }
                horas: { type: number, example: 24 }
      responses:
        "200":
          description: "{ email, password, faena, expires_at, fixed }"
        "401":
          description: No autorizado
  /api/cron/identity/purge-preview:
    post:
      tags: [auth]
      summary: Eliminar orgs preview vencidas
      responses:
        "200":
          description: "{ ok, purged, org_ids }"
        "401":
          description: No autorizado
  /api/auth/me:
    get:
      tags: [auth]
      summary: Usuario actual (JWT) + hub faenas
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "{ username, role, sitio, faena, hub, multi_faena, faenas }"
        "401":
          description: "Sin token o sesión reemplazada (code=session_replaced)"
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Renovar JWT preservando sitio
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Nuevo access_token
        "401":
          description: Sin token
  /api/me/preferencias:
    get:
      tags: [auth]
      summary: Preferencias/favoritos del usuario para un sitio
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: quillota }
      responses:
        "200":
          description: "{ usuario, sitio, prefs, favorites }"
        "403":
          description: Sitio no autorizado
    put:
      tags: [auth]
      summary: Guardar preferencias/favoritos (usuario+sitio)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sitio: { type: string }
                prefs: { type: object }
                favorites: { type: array }
      responses:
        "200":
          description: Preferencias guardadas
        "403":
          description: Sitio no autorizado
        "503":
          description: Supabase no disponible
  /api/public/sitios-auth:
    get:
      tags: [auth]
      summary: Catálogo de sitios para pantalla de login
      responses:
        "200":
          description: Lista de sitios activos (sin plantilla)
  /api/sitios:
    get:
      tags: [meteo]
      summary: Listar sitios METGO
      description: Catálogo multi-producto (quillota, paine, demo, …).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: incluir_plantilla
          in: query
          schema: { type: string, enum: ["0", "1"], default: "1" }
      responses:
        "200":
          description: Lista de sitios (slug, nombre, dominio, primary, modules, …)
        "401":
          description: Sin token
  /api/estaciones:
    get:
      tags: [meteo]
      summary: Listar estaciones
      description: |
        Por defecto `sitio=quillota` (Valle de Aconcagua).
        Otros: `paine` (Torres del Paine), `copiapo` (calidad del aire), `demo` (plantilla E6).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sitio
          in: query
          required: false
          schema:
            type: string
            enum: [quillota, paine, copiapo, demo]
            default: quillota
          description: Sitio METGO multi-producto
      responses:
        "200":
          description: Lista de estaciones (id, nombre, lat, lon, sitio, …)
        "401":
          description: Sin token
  /api/public/sitios:
    get:
      tags: [meteo]
      summary: Listar sitios (público)
      parameters:
        - name: incluir_plantilla
          in: query
          schema: { type: string, enum: ["0", "1"], default: "1" }
      responses:
        "200":
          description: Lista de sitios
  /api/public/estaciones:
    get:
      tags: [meteo]
      summary: Listar estaciones (público)
      parameters:
        - name: sitio
          in: query
          required: false
          schema:
            type: string
            enum: [quillota, paine, copiapo, demo]
            default: quillota
      responses:
        "200":
          description: Lista de estaciones
  /api/public/aire/{estacion_id}:
    get:
      tags: [aire]
      summary: Calidad del aire actual (público)
      description: |
        Open-Meteo Air Quality (modelo CAMS) + **ICAP** chileno calculado server-side
        (contaminante rector PM2.5/PM10, categorías Bueno…Emergencia) y
        recomendaciones de salud por categoría. Sitio E7 Copiapó.
        Incluye `viento_velocidad` / `viento_direccion` (m/s, grados FROM) desde
        Forecast API y `serie_24h` horaria de ICAP/PM para el mapa airshed.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
      responses:
        "200":
          description: |
            PM2.5, PM10, SO2, NO2, O3, CO, polvo, icap, nivel, recomendaciones,
            viento_velocidad, viento_direccion, serie_24h[]
        "404":
          description: Estación desconocida
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/{estacion_id}/pronostico:
    get:
      tags: [aire]
      summary: Pronóstico diario de calidad del aire (público)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 5, maximum: 7 }
      responses:
        "200":
          description: Lista de días (promedios 24 h + ICAP por día)
        "404":
          description: Estación desconocida
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/{estacion_id}/historico:
    get:
      tags: [aire]
      summary: Histórico diario de calidad del aire (público)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 92 }
      responses:
        "200":
          description: |
            Lista de días pasados (promedios 24 h + ICAP). Si CAMS no responde,
            devuelve el respaldo persistido en `aire_registros` (fallback Supabase).
        "404":
          description: Estación desconocida
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/alertas:
    get:
      tags: [aire]
      summary: Alertas de salud por umbral ICAP (público)
      description: |
        Estaciones de un sitio cuyo ICAP actual supera el umbral de alerta
        (`METGO_ICAP_UMBRAL_ALERTA`, por defecto 200 → nivel Alerta). Alimenta el
        banner de alerta de salud del SPA Copiapó.
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: copiapo }
      responses:
        "200":
          description: >
            { sitio, umbral, hay_alerta, nivel_max, estaciones:[{estacion_id,
            nombre, icap, nivel, contaminante_rector, recomendaciones}] }
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/sinca/estado:
    get:
      tags: [aire]
      summary: Estado integración SINCA (MMA)
      responses:
        "200":
          description: Catálogo, códigos, CSV dir, estado pendiente|parcial
  /api/public/aire/sinca/sesgo:
    get:
      tags: [aire]
      summary: Sesgo CAMS − SINCA (E12)
      description: |
        Compara medias diarias persistidas (fuente openmeteo_cams vs sinca).
        Sin pares alineados, pm25/pm10 vienen null y n_pares=0.
      parameters:
        - name: estacion_id
          in: query
          schema: { type: string, default: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 14, maximum: 92 }
      responses:
        "200":
          description: sesgo_medio, mae, pares
        "404":
          description: Estación fuera del catálogo SINCA
  /api/public/datos/fuentes:
    get:
      tags: [datos]
      summary: Gobernanza de fuentes (E12, público)
      parameters:
        - name: sitio
          in: query
          schema: { type: string, example: copiapo }
      responses:
        "200":
          description: Catálogo licencia/frescura/cobertura
  /api/public/ml/dominios:
    get:
      tags: [ml]
      summary: Stubs ML por dominio (E12)
      parameters:
        - name: sitio
          in: query
          schema: { type: string, example: copiapo }
      responses:
        "200":
          description: Lista modelos dominio (pm10 baseline servible)
  /api/public/ml/dominios/{modelo_id}/prediccion:
    get:
      tags: [ml]
      summary: Predicción dominio (baseline PM10 / stubs)
      parameters:
        - name: modelo_id
          in: path
          required: true
          schema: { type: string, example: pm10_episodio_copiapo }
        - name: estacion_id
          in: query
          schema: { type: string, default: copiapo_centro }
        - name: viento_ms
          in: query
          schema: { type: number }
          description: Forzar viento (modelos viento_extremo_*)
      responses:
        "200":
          description: prediccion sklearn/baseline o stub
        "404":
          description: modelo desconocido
  /api/public/datos/oficiales/estado:
    get:
      tags: [datos]
      summary: Estado Agromet/DMC (E12)
      responses:
        "200":
          description: códigos env, CSV dirs, estaciones
  /api/public/aire/modelo/airshed:
    get:
      tags: [aire]
      summary: METGO Airshed Modeler (proxy AERMOD/CALPUFF)
      description: |
        Campo de concentración proxy + vectores de viento + frames horarios
        para el airshed Copiapó. Pipeline 5 pasos inspirado en CALMET/CALPUFF/CALPOST.
        **No** es un binario EPA certificado; uso operativo / demo innovador METGO.
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: copiapo }
        - name: nx
          in: query
          schema: { type: integer, default: 28, maximum: 48 }
        - name: ny
          in: query
          schema: { type: integer, default: 28, maximum: 48 }
        - name: frames
          in: query
          schema: { type: integer, default: 6, maximum: 12 }
      responses:
        "200":
          description: pipeline, frames[].grid (values, heat_geojson, wind_vectors, max)
        "404":
          description: sitio desconocido
        "503":
          description: error de modelación / meteo
  /api/public/aire/{estacion_id}/dispersion:
    get:
      tags: [aire]
      summary: Potencial de dispersión horario (24/48/72 h)
      description: |
        Meteorología de dispersión de contaminantes por hora: **inversión térmica**
        (gradiente 2 m ↔ 925 hPa), **altura de capa límite**, **viento** (intensidad,
        dirección, ráfaga, categoría), **nubosidad baja / niebla / neblina costera**
        e **índice de dispersión (0-100)** con categoría y alerta de acumulación.
        Malla airshed Copiapó (7 puntos). Fuente Open-Meteo Forecast.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: horas
          in: query
          schema: { type: integer, default: 72, maximum: 168 }
      responses:
        "200":
          description: Serie horaria con inversión, viento, niebla e índice de dispersión
        "404":
          description: Estación desconocida
        "503":
          description: Servicio Open-Meteo no disponible
  /api/public/aire/{estacion_id}/dispersion/diaria:
    get:
      tags: [aire]
      summary: Potencial de dispersión diario (7 días, peor caso)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 16 }
      responses:
        "200":
          description: Resumen diario (peor índice del día, horas de inversión, niebla)
        "404":
          description: Estación desconocida
        "503":
          description: Servicio Open-Meteo no disponible
  /api/public/aire/{estacion_id}/dispersion/proyeccion:
    get:
      tags: [aire]
      summary: Proyección climatológica de dispersión (16-30 días)
      description: |
        Proyección **estadística** (climatología del archivo, últimos años) para el
        tramo 16-30 días. Confianza **baja**: no es un pronóstico determinista.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
      responses:
        "200":
          description: "{ confianza: baja, metodo: climatologia, indice_dispersion, potencial_dispersion, ... }"
        "404":
          description: Estación desconocida
        "503":
          description: Archivo Open-Meteo no disponible
  /api/public/aire/dispersion/alertas:
    get:
      tags: [aire]
      summary: Alertas de mala dispersión por horizonte
      description: |
        Estaciones del airshed con índice de dispersión bajo el umbral
        (`METGO_DISPERSION_UMBRAL_ALERTA`, def. 40 → acumulación probable), por
        horizonte horaria (72 h) / diaria (7 d) / proyeccion (16-30 d).
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: copiapo }
        - name: horizonte
          in: query
          schema: { type: string, enum: [horaria, diaria, proyeccion], default: horaria }
      responses:
        "200":
          description: "{ sitio, horizonte, umbral_indice, hay_alerta, estaciones[] }"
        "503":
          description: Servicio Open-Meteo no disponible
  /api/aire/{estacion_id}:
    get:
      tags: [aire]
      summary: Calidad del aire actual
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
      responses:
        "200":
          description: Igual que la variante pública
        "401":
          description: Sin token
  /api/public/spati/sitios:
    get:
      tags: [spati]
      summary: Listado de sitios/grúas SPATI
      responses:
        "200":
          description: sitios[]
  /api/public/spati/{sitio_id}/reporte-mensual:
    get:
      tags: [spati]
      summary: Reporte mensual ejecutivo (HTML v1)
      description: |
        Plantilla HTML con datos de faena. En la SPA se muestra a planes Pro/Enterprise.
      parameters:
        - name: sitio_id
          in: path
          required: true
          schema: { type: string, example: escondida }
      responses:
        "200":
          description: text/html
        "404":
          description: Sitio desconocido
  /api/public/spati/{sitio_id}/pronostico:
    get:
      tags: [spati]
      summary: Pronóstico izaje 72 h × 15 min (física + alertas 0–3)
      parameters:
        - name: sitio_id
          in: path
          required: true
          schema:
            type: string
            example: escondida
            description: >
              Slugs alta montaña: quebrada_blanca, collahuasi, cerro_colorado,
              el_abra, chuquicamata, radomiro_tomic, ministro_hales, spence,
              escondida, el_penon, la_coipa, maricunga, candelaria, los_pelambres,
              los_bronces, andina, el_teniente (+ mantos_blancos_rajo, paipote_izaje)
      responses:
        "200":
          description: >
            serie[] con perfil_vertical (10–200 m), cizalladura, variables_zona_izaje,
            perfil_vertical_ahora / perfil_vertical_pico
        "404":
          description: Sitio desconocido
        "503":
          description: NWP no disponible
    post:
      tags: [spati]
      summary: Pronóstico SPATI con perfil de dron (asimilación)
      parameters:
        - name: sitio_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                perfil_dron: { type: object }
                tau_horas: { type: number, default: 6 }
      responses:
        "200":
          description: Igual que GET + sesgo_dron_kmh
  /api/public/spati/physics/extrapolar:
    post:
      tags: [spati]
      summary: Extrapolar viento a altura de pluma (perfil logarítmico)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [v_ref, h_objetivo, z0]
              properties:
                v_ref: { type: number }
                h_objetivo: { type: number }
                z0: { type: number }
                h_ref: { type: number, default: 10 }
      responses:
        "200":
          description: "{ v_kmh }"
  /api/public/spati/physics/alta-montana:
    post:
      tags: [spati]
      summary: Densidad ISA / FR / GF alta montaña
      responses:
        "200":
          description: Parámetros físicos
  /api/public/spati/{sitio_id}/umbrales:
    get:
      tags: [spati]
      summary: M9 umbrales izaje efectivos por sitio/faena
      parameters:
        - name: sitio_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{ sitio_id, umbrales, alertas }"
        "404":
          description: Sitio no encontrado
    put:
      tags: [spati]
      summary: M9 guardar override umbrales (token CRON o Bearer)
      parameters:
        - name: sitio_id
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                umbrales: { type: object }
                alertas:
                  type: object
                  properties:
                    emails:
                      type: array
                      items: { type: string }
                    webhook_url: { type: string, nullable: true }
                    nivel_minimo: { type: integer, minimum: 0, maximum: 3 }
                rojo_min_kmh: { type: number }
                verde_max_kmh: { type: number }
      responses:
        "200":
          description: Umbrales efectivos tras guardar
        "401":
          description: No autorizado
  /api/cron/spati/alertas:
    post:
      tags: [cron]
      summary: M9 evalúa SPATI y notifica transiciones de nivel
      parameters:
        - name: token
          in: query
          schema: { type: string }
        - name: sitio
          in: query
          schema: { type: string }
        - name: forzar
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Resultado evaluación / notificaciones
        "401":
          description: CRON_SECRET inválido

    post:
      tags: [spati]
      summary: Correcciones ISA — densidad, FR, v equivalente, GF por faena/altitud
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sitio_id: { type: string, example: quebrada_blanca }
                altitud_msnm: { type: number }
                temp_celsius: { type: number, description: T real del sitio (no ISA) }
                tipo_terreno_eolico: { type: string }
                zona_climatica: { type: string }
      responses:
        "200":
          description: >
            presion_barometrica_pa, rho_isa_kg_m3, factor_reduccion,
            v_equiv_36_kmh, gust_factor (+ rho_real si se envía temp)
  /api/public/operaciones/faenas:
    get:
      tags: [operaciones]
      summary: Listado de faenas atmosféricas / mineras (Paipote, Mantos, SPATI)
      parameters:
        - name: incluir_izaje
          in: query
          schema: { type: boolean, default: true }
          description: Incluir mineras del catálogo SPATI (izaje)
      responses:
        "200":
