openapi: 3.0.3
info:
  title: METGO 3D API REST
  description: API agrometeorológica MVP — Valle de Aconcagua (Chile)
  version: 1.0.0-mvp
servers:
  - url: http://127.0.0.1:8080
    description: Desarrollo local
  - url: https://metgo-api.onrender.com
    description: Producción Render
tags:
  - name: auth
  - name: meteo
  - name: aire
  - name: operaciones
  - name: sistema
  - name: datos
  - name: servicios
paths:
  /api/health:
    get:
      tags: [sistema]
      summary: Estado del sistema (público)
      responses:
        "200":
          description: OK
  /api/health/sitios:
    get:
      tags: [sistema]
      summary: Health + frescura por sitio (E10 SLO)
      description: |
        Evalúa frescura de meteo/aire/operaciones frente a SLOs
        (`docs/roadmap/SLO_E10.md`). Query `sitio=` para un slug.
      parameters:
        - name: sitio
          in: query
          schema: { type: string }
        - name: incluir_plantilla
          in: query
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: Lista o detalle de sitio con frescura y estado
  /api/metrics:
    get:
      tags: [sistema]
      summary: Métricas Prometheus (E10)
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [prometheus, json], default: prometheus }
      responses:
        "200":
          description: text/plain Prometheus o JSON
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login JWT (E9 — claim sitio)
      description: |
        Emite JWT con `sub`, `role`, `tenant` (legacy) y **`sitio`** (producto).
        El body puede incluir `sitio` para scoped login; un usuario de Quillota
        no puede pedir `mantos_blancos` (403). Admin global (`sitio=null` en membresía)
        puede omitir sitio (acceso a todos) o pedirlo para limitar el token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: admin123 }
                sitio: { type: string, example: quillota, description: "Producto METGO (opcional)" }
      responses:
        "200":
          description: Token emitido (user.sitio en payload)
        "401":
          description: Credenciales incorrectas
        "403":
          description: Sitio no autorizado para el usuario
  /api/auth/register:
    post:
      tags: [auth]
      summary: Registro de usuario (rol lectura, auto-registro demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: campo_norte }
                password: { type: string, minLength: 6 }
                email: { type: string, format: email }
                sitio: { type: string, example: quillota }
      responses:
        "201":
          description: Usuario creado y token emitido
        "400":
          description: Validación fallida
  /api/auth/me:
    get:
      tags: [auth]
      summary: Usuario actual (JWT)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "{ username, role, tenant, sitio }"
        "401":
          description: Sin token
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Renovar JWT preservando sitio
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Nuevo access_token
        "401":
          description: Sin token
  /api/me/preferencias:
    get:
      tags: [auth]
      summary: Preferencias/favoritos del usuario para un sitio
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: quillota }
      responses:
        "200":
          description: "{ usuario, sitio, prefs, favorites }"
        "403":
          description: Sitio no autorizado
    put:
      tags: [auth]
      summary: Guardar preferencias/favoritos (usuario+sitio)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sitio: { type: string }
                prefs: { type: object }
                favorites: { type: array }
      responses:
        "200":
          description: Preferencias guardadas
        "403":
          description: Sitio no autorizado
        "503":
          description: Supabase no disponible
  /api/public/sitios-auth:
    get:
      tags: [auth]
      summary: Catálogo de sitios para pantalla de login
      responses:
        "200":
          description: Lista de sitios activos (sin plantilla)
  /api/sitios:
    get:
      tags: [meteo]
      summary: Listar sitios METGO
      description: Catálogo multi-producto (quillota, paine, demo, …).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: incluir_plantilla
          in: query
          schema: { type: string, enum: ["0", "1"], default: "1" }
      responses:
        "200":
          description: Lista de sitios (slug, nombre, dominio, primary, modules, …)
        "401":
          description: Sin token
  /api/estaciones:
    get:
      tags: [meteo]
      summary: Listar estaciones
      description: |
        Por defecto `sitio=quillota` (Valle de Aconcagua).
        Otros: `paine` (Torres del Paine), `copiapo` (calidad del aire), `demo` (plantilla E6).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sitio
          in: query
          required: false
          schema:
            type: string
            enum: [quillota, paine, copiapo, demo]
            default: quillota
          description: Sitio METGO multi-producto
      responses:
        "200":
          description: Lista de estaciones (id, nombre, lat, lon, sitio, …)
        "401":
          description: Sin token
  /api/public/sitios:
    get:
      tags: [meteo]
      summary: Listar sitios (público)
      parameters:
        - name: incluir_plantilla
          in: query
          schema: { type: string, enum: ["0", "1"], default: "1" }
      responses:
        "200":
          description: Lista de sitios
  /api/public/estaciones:
    get:
      tags: [meteo]
      summary: Listar estaciones (público)
      parameters:
        - name: sitio
          in: query
          required: false
          schema:
            type: string
            enum: [quillota, paine, copiapo, demo]
            default: quillota
      responses:
        "200":
          description: Lista de estaciones
  /api/public/aire/{estacion_id}:
    get:
      tags: [aire]
      summary: Calidad del aire actual (público)
      description: |
        Open-Meteo Air Quality (modelo CAMS) + **ICAP** chileno calculado server-side
        (contaminante rector PM2.5/PM10, categorías Bueno…Emergencia) y
        recomendaciones de salud por categoría. Sitio E7 Copiapó.
        Incluye `viento_velocidad` / `viento_direccion` (m/s, grados FROM) desde
        Forecast API y `serie_24h` horaria de ICAP/PM para el mapa airshed.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
      responses:
        "200":
          description: |
            PM2.5, PM10, SO2, NO2, O3, CO, polvo, icap, nivel, recomendaciones,
            viento_velocidad, viento_direccion, serie_24h[]
        "404":
          description: Estación desconocida
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/{estacion_id}/pronostico:
    get:
      tags: [aire]
      summary: Pronóstico diario de calidad del aire (público)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 5, maximum: 7 }
      responses:
        "200":
          description: Lista de días (promedios 24 h + ICAP por día)
        "404":
          description: Estación desconocida
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/{estacion_id}/historico:
    get:
      tags: [aire]
      summary: Histórico diario de calidad del aire (público)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 92 }
      responses:
        "200":
          description: |
            Lista de días pasados (promedios 24 h + ICAP). Si CAMS no responde,
            devuelve el respaldo persistido en `aire_registros` (fallback Supabase).
        "404":
          description: Estación desconocida
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/alertas:
    get:
      tags: [aire]
      summary: Alertas de salud por umbral ICAP (público)
      description: |
        Estaciones de un sitio cuyo ICAP actual supera el umbral de alerta
        (`METGO_ICAP_UMBRAL_ALERTA`, por defecto 200 → nivel Alerta). Alimenta el
        banner de alerta de salud del SPA Copiapó.
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: copiapo }
      responses:
        "200":
          description: >
            { sitio, umbral, hay_alerta, nivel_max, estaciones:[{estacion_id,
            nombre, icap, nivel, contaminante_rector, recomendaciones}] }
        "503":
          description: Servicio CAMS no disponible
  /api/public/aire/sinca/estado:
    get:
      tags: [aire]
      summary: Estado integración SINCA (MMA)
      responses:
        "200":
          description: Catálogo, códigos, CSV dir, estado pendiente|parcial
  /api/public/aire/sinca/sesgo:
    get:
      tags: [aire]
      summary: Sesgo CAMS − SINCA (E12)
      description: |
        Compara medias diarias persistidas (fuente openmeteo_cams vs sinca).
        Sin pares alineados, pm25/pm10 vienen null y n_pares=0.
      parameters:
        - name: estacion_id
          in: query
          schema: { type: string, default: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 14, maximum: 92 }
      responses:
        "200":
          description: sesgo_medio, mae, pares
        "404":
          description: Estación fuera del catálogo SINCA
  /api/public/datos/fuentes:
    get:
      tags: [datos]
      summary: Gobernanza de fuentes (E12, público)
      parameters:
        - name: sitio
          in: query
          schema: { type: string, example: copiapo }
      responses:
        "200":
          description: Catálogo licencia/frescura/cobertura
  /api/public/ml/dominios:
    get:
      tags: [ml]
      summary: Stubs ML por dominio (E12)
      parameters:
        - name: sitio
          in: query
          schema: { type: string, example: copiapo }
      responses:
        "200":
          description: Lista modelos dominio (pm10 baseline servible)
  /api/public/ml/dominios/{modelo_id}/prediccion:
    get:
      tags: [ml]
      summary: Predicción dominio (baseline PM10 / stubs)
      parameters:
        - name: modelo_id
          in: path
          required: true
          schema: { type: string, example: pm10_episodio_copiapo }
        - name: estacion_id
          in: query
          schema: { type: string, default: copiapo_centro }
        - name: viento_ms
          in: query
          schema: { type: number }
          description: Forzar viento (modelos viento_extremo_*)
      responses:
        "200":
          description: prediccion sklearn/baseline o stub
        "404":
          description: modelo desconocido
  /api/public/datos/oficiales/estado:
    get:
      tags: [datos]
      summary: Estado Agromet/DMC (E12)
      responses:
        "200":
          description: códigos env, CSV dirs, estaciones
  /api/public/aire/modelo/airshed:
    get:
      tags: [aire]
      summary: METGO Airshed Modeler (proxy AERMOD/CALPUFF)
      description: |
        Campo de concentración proxy + vectores de viento + frames horarios
        para el airshed Copiapó. Pipeline 5 pasos inspirado en CALMET/CALPUFF/CALPOST.
        **No** es un binario EPA certificado; uso operativo / demo innovador METGO.
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: copiapo }
        - name: nx
          in: query
          schema: { type: integer, default: 28, maximum: 48 }
        - name: ny
          in: query
          schema: { type: integer, default: 28, maximum: 48 }
        - name: frames
          in: query
          schema: { type: integer, default: 6, maximum: 12 }
      responses:
        "200":
          description: pipeline, frames[].grid (values, heat_geojson, wind_vectors, max)
        "404":
          description: sitio desconocido
        "503":
          description: error de modelación / meteo
  /api/public/aire/{estacion_id}/dispersion:
    get:
      tags: [aire]
      summary: Potencial de dispersión horario (24/48/72 h)
      description: |
        Meteorología de dispersión de contaminantes por hora: **inversión térmica**
        (gradiente 2 m ↔ 925 hPa), **altura de capa límite**, **viento** (intensidad,
        dirección, ráfaga, categoría), **nubosidad baja / niebla / neblina costera**
        e **índice de dispersión (0-100)** con categoría y alerta de acumulación.
        Malla airshed Copiapó (7 puntos). Fuente Open-Meteo Forecast.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: horas
          in: query
          schema: { type: integer, default: 72, maximum: 168 }
      responses:
        "200":
          description: Serie horaria con inversión, viento, niebla e índice de dispersión
        "404":
          description: Estación desconocida
        "503":
          description: Servicio Open-Meteo no disponible
  /api/public/aire/{estacion_id}/dispersion/diaria:
    get:
      tags: [aire]
      summary: Potencial de dispersión diario (7 días, peor caso)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 16 }
      responses:
        "200":
          description: Resumen diario (peor índice del día, horas de inversión, niebla)
        "404":
          description: Estación desconocida
        "503":
          description: Servicio Open-Meteo no disponible
  /api/public/aire/{estacion_id}/dispersion/proyeccion:
    get:
      tags: [aire]
      summary: Proyección climatológica de dispersión (16-30 días)
      description: |
        Proyección **estadística** (climatología del archivo, últimos años) para el
        tramo 16-30 días. Confianza **baja**: no es un pronóstico determinista.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
      responses:
        "200":
          description: "{ confianza: baja, metodo: climatologia, indice_dispersion, potencial_dispersion, ... }"
        "404":
          description: Estación desconocida
        "503":
          description: Archivo Open-Meteo no disponible
  /api/public/aire/dispersion/alertas:
    get:
      tags: [aire]
      summary: Alertas de mala dispersión por horizonte
      description: |
        Estaciones del airshed con índice de dispersión bajo el umbral
        (`METGO_DISPERSION_UMBRAL_ALERTA`, def. 40 → acumulación probable), por
        horizonte horaria (72 h) / diaria (7 d) / proyeccion (16-30 d).
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: copiapo }
        - name: horizonte
          in: query
          schema: { type: string, enum: [horaria, diaria, proyeccion], default: horaria }
      responses:
        "200":
          description: "{ sitio, horizonte, umbral_indice, hay_alerta, estaciones[] }"
        "503":
          description: Servicio Open-Meteo no disponible
  /api/aire/{estacion_id}:
    get:
      tags: [aire]
      summary: Calidad del aire actual
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: copiapo_centro }
      responses:
        "200":
          description: Igual que la variante pública
        "401":
          description: Sin token
  /api/public/operaciones/paipote/ventilacion:
    get:
      tags: [operaciones]
      summary: Ventilación Paipote N/R/M (corridas 06/18 UTC)
      parameters:
        - name: horizonte
          in: query
          schema: { type: string, enum: [horaria, diaria, proyeccion], default: horaria }
        - name: estacion
          in: query
          schema: { type: string, default: paipote }
        - name: forzar
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Serie con ventilacion N|R|M y metadatos de corrida
        "404":
          description: Estación desconocida
        "503":
          description: Sin meteo
  /api/public/operaciones/paipote/paquete:
    get:
      tags: [operaciones]
      summary: Paquete completo ventilación Paipote (72h + 14d + 30-90 + tramos 3h)
      responses:
        "200":
          description: Snapshot corrida vigente
        "503":
          description: Error de modelación
  /api/public/operaciones/paipote/informe:
    get:
      tags: [operaciones]
      summary: Informe HTML o PDF ventilación Paipote
      parameters:
        - name: formato
          in: query
          schema: { type: string, enum: [html, pdf], default: html }
      responses:
        "200":
          description: HTML o application/pdf
        "503":
          description: Sin datos
  /api/public/operaciones/paipote/historico:
    get:
      tags: [operaciones]
      summary: Histórico diario Archive (~7 años) Paipote
      parameters:
        - name: anios
          in: query
          schema: { type: integer, default: 7, maximum: 10 }
      responses:
        "200":
          description: Serie diaria
        "503":
          description: Archive no disponible
  /api/public/operaciones/paipote/olas-calor:
    get:
      tags: [operaciones]
      summary: Olas de calor otoño/invierno (P90 climatológico)
      parameters:
        - name: estacion
          in: query
          schema: { type: string, default: paipote }
        - name: estacion_ano
          in: query
          schema: { type: string, enum: [otono, invierno, todas], default: otono }
        - name: anios
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: eventos[] con intensidad y anomalía
        "503":
          description: Sin histórico
  /api/public/operaciones/paipote/satelite:
    get:
      tags: [operaciones]
      summary: GOES VIS/IR/WV + diagnóstico incursión nubosa
      parameters:
        - name: estacion
          in: query
          schema: { type: string, default: paipote }
        - name: bandas
          in: query
          schema: { type: string, default: "vis,ir,wv" }
      responses:
        "200":
          description: bandas[].frames + diagnostico valle
  /api/public/operaciones/conjunto/catalogo:
    get:
      tags: [operaciones]
      summary: Catálogo de series del panel Variables en conjunto
      responses:
        "200":
          description: slots[] versionados
  /api/public/operaciones/{estacion_id}/conjunto:
    get:
      tags: [operaciones]
      summary: Series horarias multi-variable (Combo extensible)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: horas
          in: query
          schema: { type: integer, default: 72 }
        - name: series
          in: query
          schema: { type: string, description: "ids separados por coma" }
      responses:
        "200":
          description: labels + series + slots_activos
        "404":
          description: Estación no encontrada
  /api/public/aire/{estacion_id}/sounding:
    get:
      tags: [aire]
      summary: Sounding modelado (proxy MetPy)
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: horas
          in: query
          schema: { type: integer, default: 24 }
      responses:
        "200":
          description: frames[].niveles + diagnostico
        "404":
          description: Estación no encontrada
  /api/public/operaciones/{estacion_id}/ventanas:
    get:
      tags: [operaciones]
      summary: Ventanas operacionales de faena (semáforo por actividad)
      description: |
        Serie horaria con semáforo **verde/amarillo/rojo** por actividad
        (tronadura, transporte, izaje) según viento sostenido, ráfaga,
        visibilidad y precipitación. Sitio E8 Mantos Blancos.
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: mb_rajo }
        - name: horas
          in: query
          schema: { type: integer, default: 48, maximum: 168 }
      responses:
        "200":
          description: "Serie horaria [{fecha_hora, viento_*, actividades:{tronadura,transporte,izaje}, nivel_global}]"
        "404":
          description: Estación desconocida
        "503":
          description: Servicio Open-Meteo no disponible
  /api/public/operaciones/alertas:
    get:
      tags: [operaciones]
      summary: Alertas por turno de faena (día 07-19 / noche 19-07)
      description: |
        Resumen del próximo turno: actividades bloqueadas (horas en rojo) por
        punto de faena. Para HSE / planificación minera.
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: mantos_blancos }
        - name: turno
          in: query
          schema: { type: string, enum: [dia, noche], default: dia }
      responses:
        "200":
          description: "{ sitio, turno, desde, hasta, hay_bloqueo, umbrales_aplicados, estaciones[] }"
        "503":
          description: Servicio Open-Meteo no disponible
  /api/public/operaciones/umbrales:
    get:
      tags: [operaciones]
      summary: Umbrales configurables del semáforo operacional
      description: |
        Umbrales efectivos (amarillo, rojo) por actividad. Defaults conservadores
        + override por sitio + `METGO_OP_UMBRALES_JSON` en el entorno de la API.
      parameters:
        - name: sitio
          in: query
          schema: { type: string, default: mantos_blancos }
      responses:
        "200":
          description: "{ sitio, umbrales, unidades, actividades, nota }"
  /api/public/meteo/{estacion_id}:
    get:
      tags: [meteo]
      summary: Resumen meteo público
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: base_torres }
      responses:
        "200":
          description: Resumen del día
        "404":
          description: Estación desconocida
        "503":
          description: OpenMeteo no disponible
  /api/public/meteo/{estacion_id}/pronostico:
    get:
      tags: [meteo]
      summary: Pronóstico diario público
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: base_torres }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Lista de días
        "404":
          description: Estación desconocida
        "503":
          description: OpenMeteo no disponible
  /api/meteo/{estacion_id}:
    get:
      tags: [meteo]
      summary: Resumen meteorológico
      security: [{ bearerAuth: [] }]
      parameters:
