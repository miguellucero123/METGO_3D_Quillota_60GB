      responses:
        "200":
          description: >
            actual + serie_meteo + serie_aire + serie_nival + nieve +
            operaciones (izaje/caminos/botaderos) + flags (M3) +
            opcional modelo_vs_observado (M5)
        "404":
          description: Faena desconocida
        "422":
          description: Faena sin coordenadas
        "503":
          description: Open-Meteo no disponible
