        "404":
          description: Sin datos
        "503":
          description: Servicio de OpenMeteo temporalmente no disponible
  /api/meteo/{estacion_id}/pronostico:
    get:
      tags: [meteo]
      summary: Pronóstico diario (OpenMeteo persistido en Supabase; fallback desde BD)
