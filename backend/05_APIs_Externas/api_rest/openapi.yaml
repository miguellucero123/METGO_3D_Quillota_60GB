      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 10 }
        - name: intervalo
          in: query
          description: dia = acumulado diario; 3h = ventanas de 3 horas OpenMeteo hourly
          schema:
            type: string
            enum: [dia, 3h]
            default: 3h
      responses:
        "200":
