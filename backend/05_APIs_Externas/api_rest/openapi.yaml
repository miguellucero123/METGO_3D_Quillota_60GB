    get:
      tags: [meteo]
      summary: Serie horaria de madrugada para identificación de helada
      description: |
        T°, HR, viento, nubosidad y punto de rocío horarios (OpenMeteo), con
        ventana crítica 03–06 h. Se cachea en Supabase (`meteo_series`, tipo
        `helada_madrugada_{dias}`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Puntos horarios, madrugada y resumen diario
