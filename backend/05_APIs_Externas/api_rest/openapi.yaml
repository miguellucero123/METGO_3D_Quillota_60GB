openapi: 3.0.3
info:
  title: METGO 3D API REST
  description: API agrometeorológica MVP — Valle de Aconcagua (Chile)
  version: 1.0.0-mvp
servers:
  - url: http://127.0.0.1:8080
    description: Desarrollo local
  - url: https://metgo-api.onrender.com
    description: Producción Render
tags:
  - name: auth
  - name: meteo
  - name: sistema
  - name: datos
  - name: servicios
paths:
  /api/health:
    get:
      tags: [sistema]
      summary: Estado del sistema (público)
      responses:
        "200":
          description: OK
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: admin123 }
      responses:
        "200":
          description: Token emitido
        "401":
          description: Credenciales incorrectas
  /api/auth/register:
    post:
      tags: [auth]
      summary: Registro de usuario (rol lectura, auto-registro demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: campo_norte }
                password: { type: string, minLength: 6 }
                email: { type: string, format: email }
      responses:
        "201":
          description: Usuario creado y token emitido
        "400":
          description: Validación fallida
  /api/estaciones:
    get:
      tags: [meteo]
      summary: Listar estaciones
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de estaciones
        "401":
          description: Sin token
  /api/meteo/{estacion_id}:
    get:
      tags: [meteo]
      summary: Resumen meteorológico
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: quillota }
        - name: tipo
          in: query
          schema: { type: string, enum: [pronostico, historico] }
      responses:
        "200":
          description: Datos meteo
        "401":
          description: Sin token
        "404":
          description: Sin datos
  /api/meteo/{estacion_id}/viento-horario:
    get:
      tags: [meteo]
      summary: Rosa de vientos horaria (dirección+velocidad) OpenMeteo forecast
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string, example: quillota }
        - name: dias
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 16 }
      responses:
        "200":
          description: Arrays paralelos `direcciones` y `velocidades` (unidad m/s)
        "404":
          description: Sin datos de viento
  /api/alertas:
    get:
      tags: [sistema]
      summary: Alertas activas (automáticas + configuradas)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista de alertas
  /api/alertas/config:
    get:
      tags: [alertas]
      summary: Listar reglas del usuario
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Reglas personalizadas
    post:
      tags: [alertas]
      summary: Crear regla de alerta
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Regla creada
        "403":
          description: Rol sin permiso
  /api/meteo/{estacion_id}/precipitacion-calibrada:
    get:
      tags: [meteo]
      summary: Pronóstico de precipitación calibrado (bias local)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 10 }
      responses:
        "200":
          description: PoP, intensidad, percentiles p10/p90
        "404":
          description: Sin pronóstico
  /api/meteo/{estacion_id}/heladas:
    get:
      tags: [meteo]
      summary: Pronóstico de heladas 7 días por cultivo
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Riesgo helada por día y cultivo
  /api/meteo/{estacion_id}/helada:
    get:
      tags: [meteo]
      summary: Pronóstico avanzado helada radiativa (6 factores)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
        - name: cultivo
          in: query
          schema: { type: string, enum: [palto, vid, citricos, tomate, lechuga], default: palto }
      responses:
        "200":
          description: Probabilidad helada, factores y recomendaciones
  /api/meteo/{estacion_id}/nubosidad:
    get:
      tags: [meteo]
      summary: Análisis cobertura nubosa y radiación solar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Nubosidad, radiación e impacto térmico
  /api/meteo/{estacion_id}/niebla:
    get:
      tags: [meteo]
      summary: Predicción de nieblas y visibilidad
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: PoP niebla, severidad y visibilidad
  /api/meteo/variables-catalogo:
    get:
      tags: [meteo]
      summary: Catálogo de variables meteorológicas (base + extensiones)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: VARIABLES_ACTUALES y VARIABLES_NUEVAS
  /api/meteo/{estacion_id}/variables-completas:
    get:
      tags: [meteo]
      summary: Conjunto de 15+ variables meteorológicas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Variables base y derivadas agrícolas
  /api/mapas/global/{variable}:
    get:
      tags: [mapas]
      summary: Grilla global por variable (modelo físico)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: variable
          in: path
          required: true
          schema:
            type: string
            enum: [temperatura, humedad, presion, precipitacion, radiacion, nubosidad, viento_velocidad]
        - name: resolucion
          in: query
          schema: { type: string, default: "1.0" }
      responses:
        "200":
          description: Grilla lats/lons/valores para canvas
  /api/mapas/regional/{estacion_id}/{variable}/animacion:
    get:
      tags: [mapas]
      summary: Animación 7 días mapa regional (IDW pronóstico)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: variable
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Serie de frames con grilla por día
  /api/mapas/regional/{estacion_id}/{variable}:
    get:
      tags: [mapas]
      summary: Mapa regional Valle (IDW estaciones METGO)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Grilla regional interpolada
  /api/mapas/comparacion-modelos/{estacion_id}/{variable}:
    get:
      tags: [mapas]
      summary: Comparación GFS vs ECMWF (OpenMeteo multi-modelo)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: variable
          in: path
          required: true
          schema:
            type: string
            enum: [temperatura, temperatura_max, temperatura_min, humedad, precipitacion, nubosidad, viento_velocidad]
        - name: dias
          in: query
          schema: { type: integer, default: 7, maximum: 16 }
      responses:
        "200":
          description: Serie diaria gfs_seamless vs ecmwf_ifs04
        "404":
          description: Estación o variable inválida
  /api/precip/{estacion_id}/calibrado:
    get:
      tags: [meteo]
      summary: Alias precipitación calibrada
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pronóstico calibrado
  /api/precip/{estacion_id}/alertas:
    get:
      tags: [alertas]
      summary: Alertas de precipitación por cultivo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Alertas activas lluvia/encharcamiento
  /api/alertas/precipitacion:
    get:
      tags: [alertas]
      summary: Alertas precipitación valle
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista consolidada
  /api/alertas/helada:
    get:
      tags: [alertas]
      summary: Alertas helada valle
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista consolidada heladas
  /api/agricola/{estacion_id}/cronograma-riego:
    get:
      tags: [agricola]
      summary: Cronograma riego inteligente (lluvia + helada)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Recomendación posponer/suspender riego
  /api/agricola/{estacion_id}/{cultivo}/cronograma:
    get:
      tags: [agricola]
      summary: Cronograma de riego dinámico 7 días
      description: |
        Próximos 7 días de recomendación de riego por cultivo,
        ajustando por pronóstico de lluvia y riesgo de helada (OpenMeteo).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema:
            type: string
            enum: [quillota, los_nogales, hijuelas, limache, olmue]
        - name: cultivo
          in: path
          required: true
          schema:
            type: string
            enum: [palto, citricos, vid, tomate, lechuga, hortalizas, cereales]
      responses:
        "200":
          description: Cronograma generado
        "400":
          description: Cultivo no válido
  /api/meteo/comparativo:
    get:
      tags: [meteo]
      summary: Comparativo multi-estación
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resumen por estación principal
  /api/meteo/comparativo/historico:
    get:
      tags: [meteo]
      summary: Histórico multi-estación (valle)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dias
          in: query
          schema: { type: integer, default: 14, maximum: 92 }
      responses:
        "200":
          description: Series diarias por estación principal
  /api/metricas/globales:
    get:
      tags: [sistema]
      summary: KPIs globales del valle
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Métricas consolidadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  estaciones_activas: { type: integer }
                  temperatura_media_max: { type: number, nullable: true }
                  temperatura_media_min: { type: number, nullable: true }
                  precipitacion_total: { type: number }
                  viento_max: { type: number }
                  humedad_media: { type: number }
                  alertas_activas: { type: integer }
                  alertas_warning: { type: integer }
                  referencia_fecha: { type: string, format: date, description: Día calendario Chile }
                  detalle_estaciones:
                    type: array
                    items:
                      type: object
                      properties:
                        estacion_id: { type: string }
                        estacion: { type: string }
                        temperatura: { type: number }
                        temperatura_max: { type: number }
                        temperatura_min: { type: number }
                        humedad: { type: number }
                        viento: { type: number }
                        precipitacion: { type: number }
                        fuente: { type: string }
                  estaciones: { type: array, items: { type: string } }
                  actualizado: { type: string, format: date-time }
  /api/integracion/estado:
    get:
      tags: [sistema]
      summary: Grado de integración por módulo (público)
      responses:
        "200":
          description: Promedio y checks por módulo
  /api/datos/etl/status:
    get:
      tags: [datos]
      summary: Última ejecución ETL meteorológico (público)
      description: Sin rutas de disco completas; uso monitoreo y smoke tests
      responses:
        "200":
          description: último run, historial count, fuentes
  /api/datos/etl/sync:
    post:
      tags: [datos]
      summary: Sincronizar OpenMeteo + CSV hacia SQLite histórico
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dias: { type: integer, example: 14 }
                incluir_csv: { type: boolean, default: true }
      responses:
        "200":
          description: Detalle por estación y estadísticas store
        "401":
          description: Sin token
  /api/catalogo:
    get:
      tags: [sistema]
      summary: Catálogo de módulos (alias de modulos)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: categoria
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Módulos del sistema
  /api/modulos:
    get:
      tags: [sistema]
      summary: Catálogo de módulos
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Módulos
  /api/servicios/streamlit/{modulo_id}/visor:
    get:
      tags: [servicios]
      summary: URL del visor de puertos (iframe)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: modulo_id
          in: path
          required: true
          schema: { type: string, example: visualizaciones }
      responses:
        "200":
          description: URLs embed local/nube
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
