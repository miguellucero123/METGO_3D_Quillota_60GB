  /api/meteo/{estacion_id}/helada:
    get:
      tags: [meteo]
      summary: Pronóstico avanzado helada radiativa por cultivo
      description: |
        Umbrales diferenciados por cultivo (palto, vid, cítricos, tomate, lechuga):
        helada meteorológica (T≤0 °C) vs agrometeorológica (daño hasta ~3 °C en sensibles).
        Probabilidad boletín: baja ≤66 %, media 66–<90 %, alta ≥90 %.
        Factores: psicrómetro (Td/Th), cielo despejado, calma, baja HR nocturna,
        oquedad/relieve (altitud estación) y humedad de suelo (sensor o proxy precipitación).
        Persiste en Supabase (`meteo_helada_pronostico`); tendencia desde `meteo_registros`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estacion_id
          in: path
          required: true
          schema: { type: string }
        - name: dias
          in: query
          schema: { type: integer, default: 7 }
        - name: cultivo
          in: query
          schema: { type: string, enum: [palto, vid, citricos, tomate, lechuga], default: palto }
        - name: humedad_suelo
          in: query
          schema: { type: number, minimum: 0, maximum: 100 }
          description: Humedad de suelo % (opcional; si falta se usa proxy de precipitación)
        - name: suelo_descubierto
          in: query
          schema: { type: boolean }
          description: Suelo sin cobertura vegetal (acelera caída de T° superficial)
      responses:
        "200":
          description: Probabilidad, umbrales por cultivo, Td/Th, oquedad, suelo y recomendaciones
