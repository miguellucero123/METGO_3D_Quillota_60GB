# API REST METGO en Render (gratis) — para que Vue en Netlify pueda hacer login
# https://render.com → New → Blueprint → este repo
#
# Tras el deploy, en Netlify (Production):
#   VITE_METGO_API = https://metgo-api.onrender.com/api
# y redeploy del sitio Vue.

services:
  - type: web
    name: metgo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # gunicorn con threads: sin esto una llamada lenta a OpenMeteo bloquea todo
    # el servidor y Render corta las demás peticiones sin cabeceras CORS.
    startCommand: gunicorn wsgi_api:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: METGO_API_HOST
        value: 0.0.0.0
      # Incluir *.pages.dev reales tras crear proyectos Cloudflare Pages.
      - key: METGO_CORS_ORIGINS
        value: https://metgo3d.netlify.app,https://metgo-quillota.pages.dev,https://metgo-copiapo.pages.dev,https://metgo-mantos.pages.dev,https://metgo-3d-quillota-60gb.streamlit.app,https://metgo-paine.netlify.app,https://metgo-copiapo.netlify.app,https://metgo-mantos.netlify.app
      - key: METGO_STREAMLIT_CLOUD_URL
        value: https://metgo-streamlit.onrender.com
      - key: METGO_JWT_SECRET
        generateValue: true
      - key: METGO_ML_LEGACY_SCAN
        value: "0"
      - key: METGO_ML_AUTO_TRAIN
        value: "1"
      # Fallar rápido hacia meteo_store; cooldown tras HTTP 429
      - key: METGO_OPENMETEO_TIMEOUT
        value: "8"
      - key: METGO_OPENMETEO_RETRIES
        value: "2"
      - key: METGO_OPENMETEO_COOLDOWN
        value: "120"
      # Fallback meteo cuando OpenMeteo rate-limita (429). Obligatorios en Dashboard Render:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: metgo-streamlit
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -c "import sklearn, joblib, openpyxl"
    startCommand: python -m streamlit run streamlit_app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: METGO_VUE_URL
        value: https://metgo3d.netlify.app
      - key: METGO_CORS_ORIGINS
        value: https://metgo3d.netlify.app,https://metgo-streamlit.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"
