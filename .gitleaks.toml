# Gitleaks v8+ — METGO 3D
# https://github.com/gitleaks/gitleaks

title = "METGO gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Placeholders, falsos positivos y rutas no operativas"
paths = [
  '''(?i)\.gitleaks\.toml$''',
  '''(?i)docs/manuales/cursor_revisar.*\.md$''',
  '''(?i)backend/12_Respaldos_Archivos/''',
  '''(?i)backend/.*/reportes/''',
  '''(?i)local/''',
  '''(?i)CORFO/''',
  '''(?i)\.rar$''',
  '''(?i)\.zip$''',
]

regexes = [
  '''05_APIs_Externas''',
  '''SINCA/Agromet/DMC''',
  '''sk_test_CHANGE_ME''',
  '''YOUR_JWT_TOKEN_HERE''',
  '''CHANGE_ME_''',
  '''tu_api_key_aqui''',
  '''generar-secreto''',
  '''secreto_para_endpoints''',
  '''ci-dev-only-not-for-production''',
  '''ROTACION_CREDENCIALES_R2''',
  '''generic-api-key false positive filenames''',
]

stopwords = [
  "example",
  "placeholder",
  "changeme",
  "change_me",
  "your_",
  "dummy",
]
