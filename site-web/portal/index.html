<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>METGO 3D — Inicio</title>
  <style>
    :root { --primary: #3d6b52; --bg: #f5f9f6; --text: #1a2e22; }
    * { box-sizing: border-box; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { color: var(--primary); }
    .card { background: #fff; border: 1px solid #d8e8dc; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
    a.btn { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; margin: 0.25rem 0.25rem 0.25rem 0; }
    a.btn:hover { background: #325a45; }
    a.sec { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    ul { line-height: 1.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>METGO 3D — Quillota</h1>
    <p>Monitoreo meteorológico y agrícola · Valle del Aconcagua</p>
    <div class="card">
      <p><strong>Aplicación principal</strong> (Vue SPA, equivalente a <code>index.html</code> en producción):</p>
      <p>
        <a class="btn" href="https://metgo-quillota.pages.dev/">Abrir inicio (index)</a>
        <a class="btn sec" href="https://metgo-quillota.pages.dev/login">Iniciar sesión</a>
      </p>
    </div>
    <div class="card">
      <p><strong>Otros accesos</strong></p>
      <ul>
        <li><a href="https://metgo3d.streamlit.app">Portal Streamlit Cloud</a></li>
        <li><a href="https://metgo-api.onrender.com/api/health">API REST (health)</a></li>
      </ul>
    </div>
    <p style="font-size:0.875rem;color:#6b7f74;">Demo: admin / admin123</p>
  </div>
</body>
</html>
