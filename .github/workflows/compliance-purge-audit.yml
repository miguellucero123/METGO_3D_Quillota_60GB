# Retención audit_auth (Ley 21.719 / R6)
# Mensual: 1er día del mes 04:00 UTC
name: Compliance purge audit_auth

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo estimar (dry_run=1)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets"
            exit 1
          fi

      - name: Purge audit_auth
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="&dry_run=1"
          fi
          for i in $(seq 1 5); do
            code=$(curl -s -o /tmp/purge.json -w "%{http_code}" --max-time 60 \
              "https://metgo-api.onrender.com/api/cron/compliance/purge-audit?token=${CRON_SECRET}${DRY}" || true)
            echo "intento $i -> HTTP $code"
            cat /tmp/purge.json || true
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
