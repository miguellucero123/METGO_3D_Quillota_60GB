# ETL meteorológico programado: OpenMeteo → Supabase vía /api/cron/sync
# - 00:00 y 12:00 UTC: sync ligero (pronóstico / recientes)
# - Domingos 03:00 UTC: sync + Archive ERA5 (histórico largo)
# Requiere secret CRON_SECRET (= env CRON_SECRET en Render).
name: ETL Meteo (00 y 12 UTC)

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      incluir_archive:
        description: "Incluir OpenMeteo Archive (ERA5)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      anios_archive:
        description: "Años de archive"
        required: false
        default: "5"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Despertar API (cold start Render)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://metgo-api.onrender.com/api/health" || true)
            echo "health intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "La API no respondió tras 12 intentos" && exit 1

      - name: Decidir flags Archive
        id: flags
        run: |
          ARCH="false"
          ANIOS="5"
          # Cron semanal (domingo 03 UTC)
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            ARCH="true"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCH="${{ github.event.inputs.incluir_archive || 'false' }}"
            ANIOS="${{ github.event.inputs.anios_archive || '5' }}"
          fi
          echo "incluir_archive=$ARCH" >> "$GITHUB_OUTPUT"
          echo "anios_archive=$ANIOS" >> "$GITHUB_OUTPUT"
          echo "Archive=$ARCH anios=$ANIOS"

      - name: Sincronizar OpenMeteo -> Supabase
        run: |
          QS="token=${{ secrets.CRON_SECRET }}"
          if [ "${{ steps.flags.outputs.incluir_archive }}" = "true" ]; then
            QS="${QS}&incluir_archive=true&anios_archive=${{ steps.flags.outputs.anios_archive }}"
          fi
          resp=$(curl -s -w "\n%{http_code}" --max-time 2400 \
            "https://metgo-api.onrender.com/api/cron/sync?${QS}")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          [ "$code" = "200" ] || exit 1

      - name: Verificar estado ETL
        run: |
          curl -s --max-time 60 "https://metgo-api.onrender.com/api/datos/etl/status"
