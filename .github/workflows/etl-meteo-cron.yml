# ETL meteorológico + calidad del aire: OpenMeteo → Supabase vía GET /api/cron/sync
# - 06:00 y 18:00 UTC: corridas ventilación Paipote (N/R/M) + sync
# - 00:00 y 12:00 UTC: sync ligero adicional
# - Domingos 03:00 UTC: sync + Archive ERA5 (7 años)
# Requiere secret CRON_SECRET (= env CRON_SECRET en Render).
name: ETL Meteo (06/18 UTC Paipote)

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      incluir_archive:
        description: "Incluir OpenMeteo Archive (ERA5)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      anios_archive:
        description: "Años de archive"
        required: false
        default: "7"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verificar CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en GitHub (Settings → Secrets). Debe coincidir con CRON_SECRET en Render."
            exit 1
          fi
          echo "CRON_SECRET configurado (longitud ${#CRON_SECRET})"

      - name: Despertar API (cold start Render)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://metgo-api.onrender.com/api/health" || true)
            echo "health intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "La API no respondió tras 12 intentos" && exit 1

      - name: Decidir flags Archive
        id: flags
        run: |
          ARCH="false"
          ANIOS="7"
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            ARCH="true"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCH="${{ github.event.inputs.incluir_archive || 'false' }}"
            ANIOS="${{ github.event.inputs.anios_archive || '7' }}"
          fi
          echo "incluir_archive=$ARCH" >> "$GITHUB_OUTPUT"
          echo "anios_archive=$ANIOS" >> "$GITHUB_OUTPUT"
          echo "Archive=$ARCH anios=$ANIOS"

      - name: Sincronizar OpenMeteo -> Supabase
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          QS="token=${CRON_SECRET}"
          if [ "${{ steps.flags.outputs.incluir_archive }}" = "true" ]; then
            QS="${QS}&incluir_archive=true&anios_archive=${{ steps.flags.outputs.anios_archive }}"
          fi
          # Reintentos ante 502/503 (cold start residual de Render free)
          for i in $(seq 1 5); do
            resp=$(curl -s -w "\n%{http_code}" --max-time 2400 \
              "https://metgo-api.onrender.com/api/cron/sync?${QS}" || true)
            body=$(echo "$resp" | head -n -1)
            code=$(echo "$resp" | tail -n 1)
            echo "intento $i -> HTTP $code"
            echo "$body"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "000" ]; then
              echo "Render no listo; esperando 20s..."
              sleep 20
              curl -s -o /dev/null --max-time 45 "https://metgo-api.onrender.com/api/health" || true
              continue
            fi
            echo "Error no recuperable HTTP $code" && exit 1
          done
          echo "Agotados reintentos tras 502/503" && exit 1

      - name: Corrida ventilación Paipote (forzar snapshot)
        if: >-
          github.event.schedule == '0 6 * * *' ||
          github.event.schedule == '0 18 * * *' ||
          github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/vent_paipote.json -w "%{http_code}" --max-time 180 -X POST \
            "https://metgo-api.onrender.com/api/cron/paipote/ventilacion?token=${CRON_SECRET}" || true)
          echo "ventilacion Paipote -> HTTP $code"
          cat /tmp/vent_paipote.json || true
          [ "$code" = "200" ] || [ "$code" = "503" ]

      - name: Verificar estado ETL
        run: |
          curl -s --max-time 60 "https://metgo-api.onrender.com/api/datos/etl/status"
