# Aplica política Pages (previews=none, production_branch) desde Git → Cloudflare API.
# Fuente: config/cloudflare/pages_security.json
# Secrets (repo): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Token mínimo: Account → Cloudflare Pages → Edit (+ Account Settings Read)
# Sin secrets: el job se OMITA (no falla el repo). Solo falla en workflow_dispatch manual.

name: Cloudflare Pages security

on:
  workflow_dispatch:
  schedule:
    # Drift check semanal (lunes 12:00 UTC)
    - cron: "0 12 * * 1"
  push:
    branches: [master, main]
    paths:
      - "config/cloudflare/pages_security.json"
      - "scripts/ops/cloudflare_pages_harden.py"
      - ".github/workflows/cloudflare-pages-security.yml"

concurrency:
  group: cloudflare-pages-security
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check secrets present
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Cloudflare no configurados — job omitido."
            echo "Para activar: GitHub → Settings → Secrets → Actions"
            echo "  CLOUDFLARE_API_TOKEN  (API Token Pages:Edit)"
            echo "  CLOUDFLARE_ACCOUNT_ID (Workers & Pages → Account ID)"
            echo "Guía: scripts/ops/CLOUDFLARE_PAGES_HARDENING.md"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Ejecutaste el workflow a mano pero faltan los secrets. Agrégalos y reintenta."
              exit 1
            fi
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Apply or check Pages security policy
        if: steps.secrets.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/ops/cloudflare_pages_harden.py --check
          else
            python scripts/ops/cloudflare_pages_harden.py
          fi
