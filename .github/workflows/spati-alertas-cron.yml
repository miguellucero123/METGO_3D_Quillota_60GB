# M9 — alertas izaje SPATI (webhook/email/outbox) cada 20 min
# Requiere secret CRON_SECRET (= env CRON_SECRET en Render).
name: SPATI alertas izaje (M9)

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      sitio:
        description: "Faena/sitio (vacío = barrido forzar=1)"
        required: false
        default: ""
      forzar:
        description: "forzar=1 recorre todos los sitios"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verificar CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta secret CRON_SECRET en GitHub Actions (mismo valor que Render → metgo-api)."
            echo "Settings → Secrets and variables → Actions → New secret: CRON_SECRET"
            exit 1
          fi
          echo "CRON_SECRET presente (len=${#CRON_SECRET})"

      - name: Despertar API (Render cold start)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/metgo_health.json -w "%{http_code}" --max-time 45 \
              "https://metgo-api.onrender.com/api/health" || echo "000")
            echo "health $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 200 /tmp/metgo_health.json || true
              echo
              exit 0
            fi
            sleep 15
          done
          echo "::error::API no respondió /api/health (Render free puede tardar >2 min)."
          exit 1

      - name: POST cron spati/alertas
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          SITIO="${{ github.event.inputs.sitio }}"
          FORZAR="${{ github.event.inputs.forzar }}"
          if [ -z "$FORZAR" ]; then FORZAR="0"; fi

          # Schedule o forzar=1 o sitio vacío → barrido completo
          QS=""
          if [ -n "$SITIO" ]; then
            QS="sitio=${SITIO}"
            echo "Modo: sitio=${SITIO}"
          elif [ "$FORZAR" = "1" ] || [ "${{ github.event_name }}" = "schedule" ] || [ -z "$SITIO" ]; then
            QS="forzar=1"
            echo "Modo: forzar=1 (todas las faenas)"
          fi

          URL="https://metgo-api.onrender.com/api/cron/spati/alertas"
          if [ -n "$QS" ]; then
            URL="${URL}?${QS}"
          fi
          echo "URL=${URL}"

          for i in $(seq 1 5); do
            : > /tmp/spati_alertas.json
            code=$(curl -sS -o /tmp/spati_alertas.json -w "%{http_code}" --max-time 180 \
              -X POST \
              -H "Accept: application/json" \
              -H "X-Cron-Token: ${CRON_SECRET}" \
              "$URL" || echo "000")
            echo "intento $i -> HTTP $code"
            echo "----- body -----"
            cat /tmp/spati_alertas.json || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$code" = "401" ]; then
              echo "::error::401 Unauthorized — CRON_SECRET de GitHub ≠ Render."
              exit 1
            fi
            if [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "000" ]; then
              echo "Reintento (cold start / timeout)..."
              sleep 20
              continue
            fi
            exit 1
          done
          echo "::error::Falló tras reintentos (último HTTP distinto de 200)."
          exit 1
