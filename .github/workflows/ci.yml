name: METGO CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install flake8 black
      - name: flake8
        run: |
          flake8 backend/05_APIs_Externas/api_rest metgo/ backend/08_Gestion_Datos/cache_openmeteo.py \
            --max-line-length=120 --extend-ignore=E501,W503 --count || true
      - name: black check
        run: |
          black --check backend/05_APIs_Externas/api_rest metgo/ tests/ || true

  test-python:
    needs: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          METGO_API_AUTH_REQUIRED: "1"
          METGO_PASSWORD_ADMIN: admin123
          METGO_PASSWORD_USER: user123
          METGO_PASSWORD_METGO: metgo2025
          METGO_JWT_SECRET: ci-test-secret
        run: pytest tests/ -q --tb=short

  build-vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/vue/package-lock.json
      - name: Build Vue
        working-directory: frontend/vue
        run: |
          npm ci
          npm run build
