name: METGO CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install flake8 black
      - name: flake8
        run: |
          flake8 backend/05_APIs_Externas/api_rest metgo/ backend/08_Gestion_Datos/cache_openmeteo.py \
            --max-line-length=120 --extend-ignore=E501,W503 --count || true
      - name: black check
        run: |
          black --check backend/05_APIs_Externas/api_rest metgo/ tests/ || true

  test-python:
    needs: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          METGO_API_AUTH_REQUIRED: "1"
          METGO_PASSWORD_ADMIN: admin123
          METGO_PASSWORD_USER: user123
          METGO_PASSWORD_METGO: metgo2025
          METGO_JWT_SECRET: ci-test-secret
        run: pytest tests/ -q --tb=short

  build-vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/vue/package-lock.json
      - name: Build Vue
        working-directory: frontend/vue
        run: |
          npm install
          npm run build

  lighthouse-spati-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/spati/package-lock.json
      - name: Build + Lighthouse a11y /login (≥90)
        working-directory: frontend/spati
        run: |
          npm install
          npm run build
          npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json

  smoke-e2e-api:
    runs-on: ubuntu-latest
    needs: test-python
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Playwright API smoke (E10)
        working-directory: e2e
        env:
          METGO_API_BASE: https://metgo-api.onrender.com
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run test:e2e:api

  smoke-ops-public:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Smoke ops públicos (prod API)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/smoke_ops_p1.py --public-only
          python scripts/smoke_ops_p1.py --validate-registro --sitio paine --public-only

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks detect
        run: |
          set -e
          test -f .gitleaks.toml
          # --no-git: solo el árbol del commit (no historial ni archivos locales ignorados)
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.0 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --verbose \
            --no-git
